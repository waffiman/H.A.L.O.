# IONOS VPS: n8n + linkedin-agent + control dashboard.
# Public access via n8n-cf-tunnel (Cloudflare) or SSH tunnel to :3080.
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - n8n-public.env
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_PROXY_HOPS=1
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Europe/Berlin
    volumes:
      - ./n8n_data:/home/node/.n8n

  linkedin-agent:
    build: .
    container_name: linkedin-agent
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - ./session_data:/app/session_data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    shm_size: "2gb"
    restart: unless-stopped

  outreach-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: outreach-dashboard
    restart: unless-stopped
    ports:
      # Local only (SSH tunnel / cloudflared). Public traffic goes through caddy (HTTPS).
      - "127.0.0.1:3080:3080"
    env_file:
      - .env
    environment:
      - PORT=3080
      - APP_ROOT=/app-data
      - HOST_APP_ROOT=/root/cold-outreach-agent
      - HALO_COOKIE_SECURE=1
    volumes:
      - .:/app-data
      # Same tree at host path so docker args / compose paths are host paths
      - /root/cold-outreach-agent:/root/cold-outreach-agent
      # Compose file read-only here: halo-ops will run `compose up linkedin-agent`
      # on request, so the dashboard must not be able to rewrite that service.
      - ./docker-compose.ionos.yml:/app-data/docker-compose.ionos.yml:ro
      - ./docker-compose.ionos.yml:/root/cold-outreach-agent/docker-compose.ionos.yml:ro
      # No docker.sock: the `docker` binary here is a shim that calls halo-ops.
    depends_on:
      - halo-ops
    dns:
      - 8.8.8.8
      - 1.1.1.1

  # Only container with docker.sock. Runs allowlisted docker commands
  # (ops/validate.mjs) for the dashboard; no published ports, token-gated.
  halo-ops:
    build:
      context: .
      dockerfile: ops/Dockerfile
    container_name: halo-ops
    restart: unless-stopped
    environment:
      - HALO_OPS_TOKEN=${HALO_OPS_TOKEN:-}
      - HALO_OPS_REPO_ROOT=/root/cold-outreach-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: compose file + --env-file are read client-side by the docker CLI
      - /root/cold-outreach-agent:/root/cold-outreach-agent:ro

  # Public HTTPS front door: Let's Encrypt cert for HALO_DOMAIN, 80 → 443 redirect.
  # Set HALO_DOMAIN in .env (DNS A record → this VPS) before `up -d caddy`.
  caddy:
    image: caddy:2.8.4
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - HALO_DOMAIN=${HALO_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - outreach-dashboard

volumes:
  caddy_data:
  caddy_config:

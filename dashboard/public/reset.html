<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>H.A.L.O. — Reset password</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b0f14; color: #e8eaed; }
    .card { width: min(420px, 100%); background: #151a22; border: 1px solid #2a3140; border-radius: 16px; padding: 28px; }
    h1 { font-size: 1.15rem; margin: 0 0 8px; }
    .muted { color: #9aa3b2; font-size: 0.88rem; margin: 0 0 18px; line-height: 1.45; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    label { font-size: 0.8rem; color: #9aa3b2; }
    input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #2a3140; background: #0f1319; color: #e8eaed; }
    button { width: 100%; margin-top: 6px; padding: 11px 14px; border: 0; border-radius: 10px; background: #22c55e; color: #04140a; font-weight: 700; cursor: pointer; }
    .err { color: #fca5a5; font-size: 0.85rem; margin-bottom: 10px; display: none; }
    .ok { color: #86efac; font-size: 0.85rem; margin-bottom: 10px; display: none; }
    .links { margin-top: 14px; font-size: 0.82rem; }
    .links a { color: #86efac; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Reset password</h1>
    <p class="muted" id="lead">Enter the email for your HALO cabinet. If an account exists, we send a reset link (email when Resend is configured, otherwise a dashboard notification for the operator).</p>
    <p class="err" id="err"></p>
    <p class="ok" id="ok"></p>
    <form id="forgot">
      <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="username" placeholder="you@company.com" /></div>
      <button type="submit">Send reset link</button>
    </form>
    <form id="reset" hidden>
      <div class="field"><label for="password">New password</label><input id="password" type="password" required minlength="8" autocomplete="new-password" /></div>
      <button type="submit">Set new password</button>
    </form>
    <p class="links"><a href="/login.html">Back to sign in</a> · <a href="/landing.html#signup">Create account</a></p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const err = document.getElementById('err');
    const ok = document.getElementById('ok');
    const forgot = document.getElementById('forgot');
    const reset = document.getElementById('reset');
    if (token) {
      document.getElementById('title').textContent = 'Choose a new password';
      document.getElementById('lead').textContent = 'Passwords are stored as hashes — HALO never shows the old one. Set a new password below.';
      forgot.hidden = true;
      reset.hidden = false;
    }
    forgot.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.style.display = 'none';
      ok.style.display = 'none';
      try {
        const res = await fetch('/api/auth/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Request failed');
        ok.textContent = 'If that email is registered, a reset link was issued.';
        ok.style.display = 'block';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
      }
    });
    reset.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.style.display = 'none';
      ok.style.display = 'none';
      try {
        const res = await fetch('/api/auth/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: document.getElementById('password').value }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Reset failed');
        ok.textContent = 'Password updated. Redirecting to sign in…';
        ok.style.display = 'block';
        setTimeout(() => { location.href = '/login.html'; }, 1200);
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>

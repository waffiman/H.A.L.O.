<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign in — H.A.L.O.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0c0f12;--panel:#181d26;--ink:#e8eaed;--muted:#9ca3af;--line:#252b37;
  --accent:#22c55e;--accent-glow:rgba(34,197,94,.35);--waffi-gold:#f5c518;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:1.5rem;
}
.card{
  width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:2rem;box-shadow:0 12px 32px rgba(0,0,0,.45);
}
.logo{display:flex;align-items:center;gap:.65rem;margin-bottom:1.4rem}
.logo img{width:32px;height:32px;display:block;border-radius:8px}
.logo span{font-weight:800;letter-spacing:.08em}
h1{font-size:1.35rem;font-weight:800;margin-bottom:1.25rem}
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.35rem;font-weight:500}
input{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:.7rem 1rem;color:var(--ink);font:inherit;outline:none;
}
.field{margin-bottom:1rem}
input:focus{border-color:var(--accent)}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:2.6rem}
.pass-toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border:0;background:transparent;color:var(--muted);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;
}
.pass-toggle:hover{color:var(--ink)}
.pass-toggle svg{width:18px;height:18px;display:block}
button.primary{
  width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:.85rem;font:inherit;font-weight:700;cursor:pointer;
  box-shadow:0 0 20px var(--accent-glow);margin-top:.2rem;
}
button.primary:disabled{opacity:.6;cursor:wait}
.err{color:#f87171;font-size:.82rem;margin-bottom:.8rem;display:none}
.foot{margin-top:1.1rem;font-size:.78rem;color:var(--muted);text-align:center;display:flex;align-items:center;justify-content:center;gap:.45rem;flex-wrap:wrap}
.foot a{display:inline-flex;align-items:center;gap:.4rem;color:inherit;text-decoration:none}
.foot img{height:14px;width:auto;display:block}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/logo.svg" width="32" height="32" alt="H.A.L.O."/><span>H.A.L.O.</span></div>
    <h1>Sign in to your cabinet</h1>
    <p class="err" id="err"></p>
    <form id="f">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required placeholder="you@company.com"/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pass-wrap">
          <input id="password" type="password" autocomplete="current-password" required minlength="8" placeholder="••••••••"/>
          <button type="button" class="pass-toggle" id="btn-pass-toggle" aria-label="Show password" title="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5A2.5 2.5 0 1 0 12 9.5a2.5 2.5 0 0 0 0 5z"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path fill="currentColor" d="M2.1 3.51 3.51 2.1l18.39 18.39-1.41 1.41-3.13-3.13A12.3 12.3 0 0 1 12 19c-5 0-9.27-3.11-11-7a13.6 13.6 0 0 1 4.2-4.86L2.1 3.51zM12 7a5 5 0 0 1 4.9 6.1l-1.57-1.57A2.5 2.5 0 0 0 12 9.5c-.3 0-.58.05-.84.15L9.65 8.14A4.96 4.96 0 0 1 12 7zm-4.68 2.9 1.62 1.62A2.5 2.5 0 0 0 12 14.5c.3 0 .58-.05.84-.15l1.62 1.62A4.98 4.98 0 0 1 7.32 9.9zM12 5c1.2 0 2.34.2 3.4.57l-1.6 1.6A5 5 0 0 0 7.9 13.07L6.1 11.27A13.4 13.4 0 0 1 12 5z"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="primary" id="btn">Sign in →</button>
    </form>
    <p class="foot">Built by <a href="https://waffiweb.com" target="_blank" rel="noopener"><img src="/waffi-logo.png" alt="WAFFi" width="72" height="22"/></a></p>
  </div>
<script>
(() => {
  const btn = document.getElementById('btn-pass-toggle');
  const input = document.getElementById('password');
  const open = btn.querySelector('.eye-open');
  const off = btn.querySelector('.eye-off');
  btn.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    open.style.display = show ? 'none' : 'block';
    off.style.display = show ? 'block' : 'none';
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    btn.title = show ? 'Hide password' : 'Show password';
  });
})();
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  err.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Login failed');
    location.href = '/';
  } catch (ex) {
    err.textContent = ex.message || 'Login failed';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign in →';
  }
});
</script>
</body>
</html>

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - ./n8n_data:/home/node/.n8n

  # LinkedIn-агент на VPS по умолчанию; локально только с профилем: docker compose --profile local-linkedin up -d linkedin-agent
  linkedin-agent:
    profiles:
      - local-linkedin
    build: .
    container_name: linkedin-agent
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - ./session_data:/app/session_data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    shm_size: '2gb'
    restart: unless-stopped

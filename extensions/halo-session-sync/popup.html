<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HALO Session Sync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <section id="screen-login" class="screen hidden">
      <p class="brand">HALO</p>
      <input type="email" id="email" class="input" placeholder="Email" autocomplete="username" />
      <input type="password" id="password" class="input" placeholder="Password" autocomplete="current-password" />
      <button type="button" class="btn primary" id="btn-login">Sign in</button>
      <p class="status" id="login-status" role="status"></p>
      <details class="more">
        <summary>API</summary>
        <input type="url" id="api-base-login" class="input" placeholder="HALO URL" />
      </details>
    </section>

    <section id="screen-main" class="screen hidden">
      <p class="brand">HALO</p>
      <button type="button" class="btn primary" id="btn-sync" disabled>Sync session</button>
      <p class="status" id="sync-status" role="status"></p>
      <div class="foot">
        <span id="platform-hint" class="hint"></span>
        <button type="button" class="link" id="btn-logout">Log out</button>
      </div>
      <input type="hidden" id="api-base" />
      <input type="hidden" id="account-email" />
      <span id="last-synced" class="hidden"></span>
    </section>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>

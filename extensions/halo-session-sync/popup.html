<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HALO Session Sync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="grid-fade"></div>
  </div>

  <div class="wrap">
    <header class="brand-bar">
      <div class="logo-mark">
        <svg class="brand-logo" viewBox="0 0 64 64" width="28" height="28" fill="none" role="img" aria-label="H.A.L.O.">
          <defs>
            <linearGradient id="haloRing" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4ade80"/>
              <stop offset="1" stop-color="#16a34a"/>
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="21" fill="#090b0e"/>
          <circle cx="32" cy="32" r="27" stroke="url(#haloRing)" stroke-width="2.2" opacity="0.35"/>
          <circle cx="32" cy="32" r="21" stroke="url(#haloRing)" stroke-width="2.6"/>
          <circle cx="32" cy="11" r="2.2" fill="#4ade80"/>
          <g class="wave-lines" stroke="#4ade80" stroke-width="1.7" stroke-linecap="round" fill="none">
            <path d="M14.5 24.5c-3.2 3.4-3.8 8.2-2.2 12.2" opacity="0.55">
              <animate attributeName="opacity" values="0.25;0.85;0.25" dur="1.35s" repeatCount="indefinite"/>
            </path>
            <path d="M18.2 26.2c-2.1 2.4-2.5 5.8-1.4 8.6" opacity="0.8">
              <animate attributeName="opacity" values="0.35;1;0.35" dur="1.35s" begin="0.12s" repeatCount="indefinite"/>
            </path>
            <path d="M11.8 22.8c-4.2 4.4-5 10.4-2.8 15.4" opacity="0.4">
              <animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.35s" begin="0.22s" repeatCount="indefinite"/>
            </path>
            <path d="M49.5 24.5c3.2 3.4 3.8 8.2 2.2 12.2" opacity="0.55">
              <animate attributeName="opacity" values="0.25;0.85;0.25" dur="1.35s" begin="0.08s" repeatCount="indefinite"/>
            </path>
            <path d="M45.8 26.2c2.1 2.4 2.5 5.8 1.4 8.6" opacity="0.8">
              <animate attributeName="opacity" values="0.35;1;0.35" dur="1.35s" begin="0.18s" repeatCount="indefinite"/>
            </path>
            <path d="M52.2 22.8c4.2 4.4 5 10.4 2.8 15.4" opacity="0.4">
              <animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.35s" begin="0.28s" repeatCount="indefinite"/>
            </path>
          </g>
          <g>
            <path fill="#e8eaed" d="M24.8 33.2c-1 0-1.8.9-1.8 2.1v3.8c0 6.6 4.4 11.4 11.8 11.4 6.6 0 10.7-4.3 10.7-10.4V25.2c0-1.3-1-2.3-2.2-2.3-1.2 0-2.2 1-2.2 2.3v9.2h-1.4V21.4c0-1.3-1-2.4-2.3-2.4-1.2 0-2.2 1.1-2.2 2.4v13.2h-1.5V20.2c0-1.3-1-2.4-2.3-2.4s-2.3 1.1-2.3 2.4v15.2h-1.4v-7.6c0-1.2-1-2.1-2.2-2.1-1.1 0-2.1.9-2.1 2.1v6.2h-.6z"/>
            <animateTransform attributeName="transform" type="rotate" values="-24 34 44; 12 34 44; -24 34 44" dur="1.35s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
          </g>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">H.A.L.O.</span>
        <span class="brand-sub">Session Sync</span>
      </div>
    </header>

    <section id="screen-login" class="screen">
      <p class="lead">Sign in with your HALO cabinet</p>
      <div class="field">
        <label class="lbl" for="email">Email</label>
        <input type="email" id="email" class="input" placeholder="you@company.com" autocomplete="username" />
      </div>
      <div class="field">
        <label class="lbl" for="password">Password</label>
        <div class="pass-wrap">
          <input type="password" id="password" class="input" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="pass-toggle" id="btn-pass-toggle" aria-label="Show password" title="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5A2.5 2.5 0 1 0 12 9.5a2.5 2.5 0 0 0 0 5z"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="currentColor" d="M2.1 3.51 3.51 2.1l18.39 18.39-1.41 1.41-3.13-3.13A12.3 12.3 0 0 1 12 19c-5 0-9.27-3.11-11-7a13.6 13.6 0 0 1 4.2-4.86L2.1 3.51zM12 7a5 5 0 0 1 4.9 6.1l-1.57-1.57A2.5 2.5 0 0 0 12 9.5c-.3 0-.58.05-.84.15L9.65 8.14A4.96 4.96 0 0 1 12 7zm-4.68 2.9 1.62 1.62A2.5 2.5 0 0 0 12 14.5c.3 0 .58-.05.84-.15l1.62 1.62A4.98 4.98 0 0 1 7.32 9.9zM12 5c1.2 0 2.34.2 3.4.57l-1.6 1.6A5 5 0 0 0 7.9 13.07L6.1 11.27A13.4 13.4 0 0 1 12 5z"/></svg>
          </button>
        </div>
      </div>
      <button type="button" class="btn primary" id="btn-login">Sign in</button>
      <p class="status" id="login-status" role="status"></p>
    </section>

    <section id="screen-pick" class="screen hidden">
      <p class="lead">Choose a network to sync</p>
      <div class="pick-row">
        <button type="button" class="pick-btn" id="btn-pick-linkedin" title="Open LinkedIn">
          <span class="pick-active-dot hidden" id="pick-active-linkedin" title="Active">Active</span>
          <span class="pick-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="#0A66C2" d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.47-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22 0H2C.9 0 0 .9 0 2v20c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V2c0-1.1-.9-2-2-2z"/></svg>
          </span>
          <span class="pick-label">LinkedIn</span>
        </button>
        <button type="button" class="pick-btn" id="btn-pick-x" title="Open X">
          <span class="pick-active-dot hidden" id="pick-active-x" title="Active">Active</span>
          <span class="pick-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#e8eaed" d="M18.9 2H22l-6.78 7.75L23.3 22h-6.5l-5.09-6.65L5.9 22H2.78l7.25-8.29L.7 2h6.66l4.6 6.1L18.9 2zm-1.14 18h1.8L6.35 3.9H4.42L17.76 20z"/></svg>
          </span>
          <span class="pick-label">X</span>
        </button>
      </div>
      <div class="foot">
        <span class="hint">Opens in this browser tab</span>
        <button type="button" class="link" id="btn-logout-pick">Log out</button>
      </div>
    </section>

    <section id="screen-sync" class="screen hidden">
      <div class="sync-badge" id="sync-badge">LinkedIn</div>
      <p class="lead" id="sync-lead">Make sure you are logged into your account on this site, then synchronize.</p>
      <div id="sync-active" class="active-card hidden" role="status">
        <span class="active-ico" aria-hidden="true">✓</span>
        <div class="active-copy">
          <strong id="active-title">Active</strong>
          <span id="active-sub">Session linked to HALO</span>
        </div>
      </div>
      <button type="button" class="btn primary" id="btn-sync" disabled>Synchronize</button>
      <button type="button" class="link resync-link hidden" id="btn-resync">Sync again</button>
      <p class="status" id="sync-status" role="status"></p>
      <div class="foot">
        <button type="button" class="link" id="btn-back-pick">← Change network</button>
        <button type="button" class="link" id="btn-logout">Log out</button>
      </div>
    </section>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
